embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  normalize: true

vector_db:
  provider: chromadb
  collection: groww_mf_faq
  persist_dir: data/chroma_store
  distance: cosine

llm:
  provider: groq
  model: qwen/qwen3.8-27b   # verify exact Groq model ID before first live call
  temperature: 0
  max_tokens: 200
  timeout_seconds: 30

retrieval:
  top_k: 4
  score_threshold: 0.25
  score_metric: cosine_similarity

chunking:
  strategy: structure_aware
  target_chars: 900
  overlap_chars: 120

paths:
  source_registry: config/source_registry.yaml
  raw_pages_dir: data/raw_pages
  page_manifest: data/page_manifest.json
  loading_manifest: data/loading_manifest.json
  chunks_dir: data/chunks
  chunk_manifest: data/chunk_manifest.json
  embeddings_dir: data/embeddings
  vector_file: vectors.npy
  embedding_manifest: data/embeddings/embedding_manifest.json
  index_manifest: data/index_manifest.json
  retrieval_logs_dir: logs/retrieval
  answers_dir: logs/answers

ui:
  title: Groww MF Facts Assistant
  disclaimer: Facts-only. No investment advice.
  examples:
    - What is the expense ratio of HDFC Large Cap Fund Direct Growth?
    - What is the lock-in period for HDFC ELSS Tax Saver Fund?
    - How do I download a capital-gains statement?
